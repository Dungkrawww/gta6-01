<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara City — an open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a1016; }
  #game { display: block; width: 100vw; height: 100vh; }
  .panel {
    position: fixed; color: #fff; font-family: system-ui, sans-serif;
    background: rgba(8, 14, 22, 0.62); border-radius: 8px; padding: 8px 12px;
    pointer-events: none; z-index: 5;
  }
  #hud-location { top: 12px; left: 12px; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
  #hud-speed { top: 12px; right: 12px; font-size: 15px; font-weight: 700; text-align: right; }
  #hud-hint { bottom: 12px; left: 12px; font-size: 13px; opacity: 0.9; }
  #hud-prompt {
    bottom: 64px; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 700; color: #ffd75e;
  }
  #minimap {
    position: fixed; right: 12px; bottom: 12px; z-index: 5;
    border: 2px solid rgba(255, 255, 255, 0.55); border-radius: 8px;
    background: rgba(8, 14, 22, 0.72);
  }
  #title {
    position: fixed; inset: 0; z-index: 10; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-family: system-ui, sans-serif; text-align: center;
    background: linear-gradient(rgba(10, 20, 30, 0.25), rgba(10, 20, 30, 0.65));
    cursor: pointer;
  }
  #title.hidden { display: none; }
  #title h1 { font-size: 64px; margin: 0; letter-spacing: 6px; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6); }
  #title p { font-size: 18px; margin: 10px 0 0; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); }
  #title .controls { font-size: 14px; opacity: 0.9; margin-top: 26px; line-height: 1.8; }
  #title .play { font-size: 20px; font-weight: 700; color: #ffd75e; margin-top: 30px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud-location" class="panel">SOLARA CITY</div>
<div id="hud-speed" class="panel">0 km/h — On foot</div>
<div id="hud-hint" class="panel">WASD move &nbsp;·&nbsp; Shift run &nbsp;·&nbsp; E enter / exit car &nbsp;·&nbsp; drag mouse to orbit</div>
<div id="hud-prompt" class="panel"></div>
<canvas id="minimap" width="180" height="180"></canvas>
<div id="title">
  <h1>SOLARA CITY</h1>
  <p>Raka the courier. One hot package. A whole city watching.</p>
  <div class="controls">WASD — move &nbsp;·&nbsp; SHIFT — run &nbsp;·&nbsp; E — enter / exit car &nbsp;·&nbsp; MOUSE DRAG — camera</div>
  <div class="play">Click or press Enter to play</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
